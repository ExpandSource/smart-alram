<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 학업/일정 알람 클래스 클락</title>
  <script>
    try {
      const saved = localStorage.getItem('school_alarm_theme');
      document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
        ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (_) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-area">
        <svg class="header-logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 17H2a3 3 0 0 0 3-3V9a7 7 0 0 1 14 0v5a3 3 0 0 0 3 3zm-3 0v1a3 3 0 0 1-6 0v-1"></path>
          <circle cx="12" cy="3" r="1"></circle>
        </svg>
        <div><h1>Smart Alarm</h1><p class="brand-caption">매일의 시간을, 차분하게.</p></div>
      </div>
      <div class="header-actions">
        <div class="theme-switch" role="group" aria-label="화면 테마">
          <button type="button" data-theme-choice="light" aria-pressed="false"><span aria-hidden="true">☀</span> Light</button>
          <button type="button" data-theme-choice="dark" aria-pressed="false"><span aria-hidden="true">☾</span> Dark</button>
        </div>
      <button type="button" class="status-badge warning" id="audio-status-badge" title="클릭하여 소리 활성화">
        <span class="pulse-dot warning"></span>
        <span class="status-text">소리 차단됨 (화면 클릭하여 활성화)</span>
      </button>
      </div>
    </header>

    <main class="app-main">
      <!-- Dashboard Section (Clock & Next Alarm) -->
      <section class="dashboard-section">
        <div class="glass-card clock-card">
          <span class="info-label">현재 시간</span>
          <div class="clock-display">
            <span id="clock-hours">00</span>
            <span class="clock-colon">:</span>
            <span id="clock-minutes">00</span>
            <span class="clock-seconds-wrapper">
              <span class="clock-colon">:</span>
              <span id="clock-seconds">00</span>
            </span>
          </div>
          <div class="date-display" id="date-display">2026년 07월 06일 월요일</div>
        </div>

        <div class="glass-card next-alarm-card">
          <div class="next-alarm-info">
            <span class="info-label">다음 예정된 알람</span>
            <h2 class="next-alarm-title" id="next-alarm-title">대기 중...</h2>
            <div class="next-alarm-time" id="next-alarm-time">--:--</div>
          </div>
          <div class="countdown-display" id="countdown-display">
            알람을 등록하거나 활성화해주세요.
          </div>
        </div>
      </section>

      <!-- Settings & Controls Panel -->
      <section class="controls-section">
        <div class="glass-card settings-card">
          <h3>소리 설정</h3>

          <div class="settings-grid">
            <!-- Sound Select -->
            <div class="settings-group">
              <label for="sound-select">알람 벨소리</label>
              <div class="select-wrapper">
                <select id="sound-select">
                  <option value="school-bell">학교 종소리 (웨스트민스터)</option>
                  <option value="digital-beep">디지털 알람 (전자음)</option>
                  <option value="gentle-chime">부드러운 알림음 (멜로디)</option>
                  <option value="retro-bell">아날로그 벨 (기계음)</option>
                  <option value="door-chime">딩동 차임 (두 음 종소리)</option>
                  <option value="soft-pulse">잔잔한 펄스 (부드러운 전자음)</option>
                  <option value="rising-notes">상승 알림 (경쾌한 세 음)</option>
                  <option value="wood-mallet">나무 실로폰 (맑고 짧은 멜로디)</option>
                </select>
                <div class="select-arrow"></div>
              </div>
            </div>

            <!-- Repeat Select -->
            <div class="settings-group">
              <label for="repeat-select">알람 반복 횟수</label>
              <div class="select-wrapper">
                <select id="repeat-select">
                  <option value="1">1번</option>
                  <option value="2">2번 (기본값)</option>
                  <option value="3">3번</option>
                  <option value="5">5번</option>
                  <option value="0">계속 울림</option>
                </select>
                <div class="select-arrow"></div>
              </div>
            </div>

            <!-- Volume Slider -->
            <div class="settings-group">
              <div class="volume-header">
                <label for="volume-slider">볼륨 조절</label>
                <span id="volume-percentage">80%</span>
              </div>
              <div class="volume-control-wrapper">
                <button type="button" class="icon-btn" id="mute-btn" title="음소거 토글">
                  <svg id="volume-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                  </svg>
                </button>
                <input type="range" id="volume-slider" min="0" max="100" value="80" class="slider-input">
              </div>
            </div>
          </div>

          <div class="test-actions">
            <button type="button" class="btn secondary-btn" id="test-sound-btn">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              소리 미리 듣기
            </button>
            <button type="button" class="btn text-btn" id="stop-test-btn" disabled>정지</button>
          </div>
        </div>

        <div class="action-card">
          <button type="button" class="btn primary-btn font-medium" id="add-alarm-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            새 알람 추가
          </button>
          <div class="quick-utilities">
            <button type="button" class="btn secondary-btn flex-1" id="reset-default-btn" title="교시 스케줄 복원">
              기본 시간표 불러오기
            </button>
            <button type="button" class="btn outline-btn" id="clear-all-btn" title="모든 알람 삭제">
              전체 삭제
            </button>
          </div>
        </div>
      </section>

      <!-- Alarms List Section -->
      <section class="alarms-section">
        <div class="section-header">
          <h3>알람 목록</h3>
          <div class="alarm-list-actions">
            <span class="count-badge" id="alarm-count">0개 등록됨</span>
            <button type="button" class="btn secondary-btn" id="sort-alarms-btn" title="알람을 이른 시간부터 정렬합니다">시간순 정렬</button>
          </div>
        </div>
        <p class="section-description">시간과 이름을 눌러 바로 수정하세요. 변경 사항은 자동 저장됩니다.</p>

        <div class="alarms-grid" id="alarms-grid">
          <!-- Alarms will be dynamically rendered here -->
        </div>
      </section>
      <footer class="app-footer"><span>이 브라우저에 자동 저장</span><span>알람이 울리도록 이 화면을 열어두세요.</span></footer>
    </main>

    <!-- Overlay Alarm Alert Modal -->
    <div class="alarm-overlay" id="alarm-overlay">
      <div class="alarm-alert-card">
        <div class="alert-bell-wrapper">
          <div class="bell-glow-ring ring-1"></div>
          <div class="bell-glow-ring ring-2"></div>
          <div class="bell-glow-ring ring-3"></div>
          <svg class="alert-bell-icon animate-bell" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </div>
        <div class="alert-time-display" id="alert-time-display">12:30</div>
        <h2 class="alert-title" id="alert-title">점심시간 시작</h2>
        <p class="alert-subtitle">일정에 맞춰 알람이 발생했습니다.</p>
        <div class="alert-actions">
          <button type="button" class="btn alert-dismiss-btn" id="dismiss-alarm-btn">알람 끄기</button>
          <button type="button" class="btn alert-snooze-btn" id="snooze-alarm-btn">5분 미루기</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
